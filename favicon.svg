<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="df-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="forge-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052CC"/>
      <stop offset="50%" stop-color="#00965E"/>
      <stop offset="100%" stop-color="#00F59B"/>
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F59B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="64" height="64" rx="14" fill="url(#df-bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="url(#forge-grad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Anvil Base / Cyber Forge Shape -->
  <path d="M14 42L18 36H46L50 42C50 42 44 48 32 48C20 48 14 42 14 42Z" fill="url(#forge-grad)"/>
  
  <!-- Cyber Anvil Top Block / Data Hammer Center -->
  <path d="M12 28C12 26 14 24 17 24H47C50 24 52 26 52 28C52 30 50 32 46 32H18C14 32 12 30 12 28Z" fill="#38BDF8" fill-opacity="0.9"/>
  <path d="M22 32H42L38 38H26L22 32Z" fill="url(#forge-grad)" fill-opacity="0.8"/>

  <!-- Data Sparks / Digital Hologram Crystals -->
  <path d="M32 12L36 19L32 26L28 19L32 12Z" fill="url(#spark-grad)" filter="url(#glow)"/>
  <circle cx="21" cy="18" r="2" fill="#00F59B" filter="url(#glow)"/>
  <circle cx="43" cy="18" r="2" fill="#38BDF8" filter="url(#glow)"/>

  <!-- Core Circuit Lines -->
  <line x1="32" y1="26" x2="32" y2="32" stroke="#00F59B" stroke-width="1.5" stroke-linecap="round"/>
</svg>
